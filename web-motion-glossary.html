<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>網頁動態術語表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: specimen-book grid — each term is a card with a live "stage" on top, text below; sticky filter bar. */
:root{
  --bg:#eceee9; --surface:#f9faf7; --stage:#e2e5de; --ink:#15171a; --mut:#5c615d; --line:#d3d7cf;
  --accent:#2f43c9; --accent-soft:#dde2fb; --on-accent:#ffffff;
  --obj:#2f43c9; --obj2:#eea03a; --on-obj2:#211607;
  --danger:#c4372b; --ok:#2c8a57;
  --neu-bg:#e2e5de; --neu-hi:#ffffff; --neu-lo:#bfc4ba;
  --shadow:rgba(20,24,30,.14);
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --stage:#212429; --ink:#e8eae5; --mut:#9ba19c; --line:#2d3137;
  --accent:#8e9cff; --accent-soft:#262c55; --on-accent:#0d1024;
  --obj:#7f8eff; --obj2:#f0b25a; --on-obj2:#211607;
  --danger:#ff7b6f; --ok:#6fd39b;
  --neu-bg:#212429; --neu-hi:#2d3137; --neu-lo:#121417;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --stage:#212429; --ink:#e8eae5; --mut:#9ba19c; --line:#2d3137;
  --accent:#8e9cff; --accent-soft:#262c55; --on-accent:#0d1024;
  --obj:#7f8eff; --obj2:#f0b25a; --on-obj2:#211607;
  --danger:#ff7b6f; --ok:#6fd39b;
  --neu-bg:#212429; --neu-hi:#2d3137; --neu-lo:#121417;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* hero */
.hero{padding-block:56px 28px;display:grid;gap:14px;max-width:780px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:17px;color:var(--mut);margin:0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;font:13px var(--f-mono);color:var(--mut)}
.stats span{border:1px solid var(--line);border-radius:99px;padding:3px 10px}

/* top 6 */
.top6{display:grid;gap:14px;padding-block:8px 28px}
.top6 h2{font-size:20px}
.top6-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.t6{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit}
.t6:hover{border-color:var(--accent)}
.t6 b{font:600 15px var(--f-display);grid-column:2}
.t6 .n{font:500 12px var(--f-mono);color:var(--accent);grid-row:1/3}
.t6 span:last-child{grid-column:2;color:var(--mut);font-size:13.5px}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar input{max-width:420px;flex:1 1 200px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;order:3}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);opacity:.6;margin-left:4px}
.bar .pause{margin-left:auto}

/* sections + cards */
.cat{padding-block:36px 8px;display:grid;gap:16px}
.cat-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.cat-h h2{font-size:28px;font-weight:700}
.cat-h .en{font:500 13px var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.cat-h p{flex-basis:100%;margin:0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;scroll-margin-top:80px}
.term:target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.t-body{padding:14px 16px 16px;display:grid;gap:9px;min-width:0}
.names{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.names h3{font-size:19px;font-weight:700}
.names .en{font:500 13px var(--f-mono);color:var(--accent)}
.t-say{margin:0;font-size:13px;color:var(--mut)}
.t-say q{color:var(--ink)}
.def{margin:0}
.aka{display:flex;flex-wrap:wrap;gap:4px}
.aka span{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--mut)}
.ai{background:var(--accent-soft);border-radius:8px;padding:9px 11px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start}
.ai .lb{font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--accent);grid-column:1}
.ai p{margin:0;font-size:14px;grid-column:1}
.ai button{grid-column:2;grid-row:1/3;border:0;background:var(--surface);color:var(--accent);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
.plat{margin:0;font-size:12px;color:var(--mut)}
.plat b{font-weight:500;color:var(--ink)}
.empty{color:var(--mut);padding:24px 0}

/* stage */
.stage{position:relative;height:172px;background:var(--stage);border-bottom:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;flex-shrink:0}
.stage.browser{padding-top:22px}
.stage.browser::before{content:"";position:absolute;top:0;left:0;right:0;height:22px;background:var(--surface);border-bottom:1px solid var(--line);z-index:3;
  background-image:radial-gradient(circle 3.5px at 12px 11px,var(--line) 3px,transparent 3.5px),radial-gradient(circle 3.5px at 24px 11px,var(--line) 3px,transparent 3.5px),radial-gradient(circle 3.5px at 36px 11px,var(--line) 3px,transparent 3.5px)}
.stage.browser>.sx{position:absolute;inset:22px 0 0 0}
.sx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px}
.replay{position:absolute;top:6px;right:6px;z-index:5;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;color:var(--mut)}
.stage.browser .replay{top:2px;padding:0 7px}
.hint{position:absolute;left:8px;bottom:6px;z-index:4;font:500 11px var(--f-mono);color:var(--mut);background:var(--surface);border-radius:4px;padding:1px 6px;pointer-events:none}
.paused .stage *,.paused .stage *::before,.paused .stage *::after{animation-play-state:paused!important}

/* demo primitives */
.o{width:40px;height:40px;border-radius:8px;background:var(--obj);flex-shrink:0}
.o.sm{width:26px;height:26px;border-radius:6px}
.o.b{background:var(--obj2)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.ln{display:block;height:8px;border-radius:4px;background:var(--line)}
.pad{padding:12px 14px;display:grid;gap:8px}
.sc{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.col{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr}
.col .sc,.spy .sc{position:relative;inset:auto;min-height:0}
.ctl{display:flex;gap:6px;padding:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface)}
.ctl button{border:1px solid var(--line);background:var(--bg);border-radius:5px;font-size:12px;padding:2px 8px;cursor:pointer}
.c1{background:var(--obj);color:var(--on-accent)} .c2{background:var(--obj2);color:var(--on-obj2)} .c3{background:var(--ink);color:var(--bg)} .c4{background:var(--accent-soft);color:var(--accent)}

/* scroll */
.par{position:relative;height:470px}
.par-bk{position:absolute;inset:0;will-change:transform}
.par-bk i{position:absolute;border-radius:50%;background:var(--obj2);opacity:.6}
.par-fr{position:relative;padding:14px;display:grid;gap:16px;width:58%}
.stk{position:sticky;top:0;margin:0;background:var(--accent);color:var(--on-accent);padding:4px 12px;font:500 12px var(--f-mono)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .5s ease-out,transform .5s ease-out}
.rv.in{opacity:1;transform:none}
.snap{position:absolute;inset:0;display:flex;align-items:center;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:18%;scrollbar-width:none}
.snap-i{flex:0 0 64%;height:110px;scroll-snap-align:center;border-radius:10px;display:grid;place-items:center;font:700 34px var(--f-display);background:var(--surface);border:1px solid var(--line);color:var(--mut)}
.pbar{position:absolute;top:0;left:0;right:0;height:4px;z-index:3;background:transparent}
.pbar b{display:block;height:100%;width:0;background:var(--accent)}
.scrub{height:520px}
.pin{position:sticky;top:0;height:150px;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.pin .mono{font-size:12px;color:var(--mut);width:40px}
.hs-row{display:flex;gap:10px;padding-inline:14px;will-change:transform}
.hs-row div{flex:0 0 110px;height:96px;border-radius:8px;display:grid;place-items:center;font-weight:700}
.sec{padding:10px 14px;display:grid;gap:7px;min-height:110px;border-bottom:1px dashed var(--line)}
.sec b{font-size:13px}
.btt{position:absolute;right:10px;bottom:10px;z-index:4;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.btt.show{opacity:1;transform:none;pointer-events:auto}
.inf-l{text-align:center;font-size:11px;color:var(--mut);padding:8px}
.spy{position:absolute;inset:0;display:grid;grid-template-columns:70px 1fr}
.spy nav{display:grid;align-content:start;gap:4px;padding:10px 6px;border-right:1px solid var(--line);background:var(--surface)}
.spy nav a{font-size:12px;text-decoration:none;color:var(--mut);padding:2px 6px;border-radius:4px}
.spy nav a.on{background:var(--accent);color:var(--on-accent)}

/* slide */
.car,.sw{position:absolute;inset:0;overflow:hidden}
.car-t,.sw-t{display:flex;height:100%;transition:transform .5s cubic-bezier(.65,0,.35,1)}
.car-s{flex:0 0 100%;display:grid;place-items:center;font:700 22px var(--f-display)}
.car-a{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.car-p{left:8px}.car-n{right:8px}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dots button{width:8px;height:8px;padding:0;border-radius:50%;border:0;background:var(--surface);opacity:.55;cursor:pointer}
.dots button.on{opacity:1;width:20px;border-radius:4px;transition:width .3s}
.fs-i{position:absolute;inset:0;display:grid;place-items:center;font:700 22px var(--f-display);opacity:0;transition:opacity .8s}
.fs-i.on{opacity:1}
.mq{width:100%;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-t{display:flex;gap:12px;width:max-content;animation:mq 14s linear infinite}
.mq:hover .mq-t{animation-play-state:paused}
.mq-i{font:700 16px var(--f-display);padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);white-space:nowrap}
@keyframes mq{to{transform:translateX(calc(-50% - 6px))}}
.sw{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.sw:active{cursor:grabbing}
.sw-t>div{flex:0 0 100%;display:grid;place-items:center;font:700 22px var(--f-display)}
.pk{position:absolute;inset:0;display:flex;align-items:center;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:14px;scroll-padding-inline:14px;scrollbar-width:none}
.pk-i{flex:0 0 78%;height:116px;border-radius:10px;scroll-snap-align:start;display:grid;place-items:center;font:700 22px var(--f-display)}
.ba{position:absolute;inset:0;--p:50%}
.ba-a,.ba-b{position:absolute;inset:0;display:flex;align-items:flex-start;padding:10px;font:500 11px var(--f-mono)}
.ba-a{background:radial-gradient(circle at 70% 60%,var(--obj2) 0 22%,transparent 23%),linear-gradient(160deg,var(--obj),var(--accent-soft));justify-content:flex-end;color:var(--on-accent)}
.ba-b{background:radial-gradient(circle at 70% 60%,var(--mut) 0 22%,transparent 23%),repeating-linear-gradient(45deg,var(--line) 0 6px,var(--stage) 6px 12px);clip-path:inset(0 calc(100% - var(--p)) 0 0);color:var(--mut)}
.ba-line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:var(--surface);pointer-events:none}
.ba-line::after{content:"⇔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;color:var(--ink);box-shadow:0 2px 6px var(--shadow)}
.ba-r{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.th{display:grid;gap:8px;width:80%}
.th-m{height:100px;border-radius:8px;display:grid;place-items:center;font:700 22px var(--f-display)}
.th-r{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.th-t{height:30px;border-radius:5px;border:2px solid transparent;cursor:pointer;padding:0}
.th-t.on{border-color:var(--ink)}

/* hover */
.lift{width:150px;height:90px;transition:transform .25s ease-out,box-shadow .25s ease-out;cursor:pointer}
.lift:hover,.lift:active{transform:translateY(-6px);box-shadow:0 14px 24px -10px var(--shadow)}
.hz{position:relative;width:190px;height:116px;border-radius:10px;overflow:hidden;cursor:pointer}
.hz-i{position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,var(--obj2) 0 18%,transparent 19%),radial-gradient(circle at 72% 35%,var(--accent-soft) 0 14%,transparent 15%),linear-gradient(135deg,var(--obj),var(--ink));transition:transform .6s ease-out}
.hz:hover .hz-i{transform:scale(1.15)}
.hz-cap{position:absolute;left:10px;bottom:8px;color:#fff;font-size:12px;font-weight:500}
.tl{position:relative;width:180px;height:110px;border-radius:12px;background:linear-gradient(135deg,var(--obj),var(--ink));color:#fff;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s ease-out;overflow:hidden;box-shadow:0 12px 24px -12px var(--shadow)}
.tl b{font-family:var(--f-display);letter-spacing:.1em}
.tl span{font:12px var(--f-mono);opacity:.8}
.tl-g{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.35),transparent 55%);pointer-events:none}
.mg{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.rp{position:relative;overflow:hidden}
.rp i{position:absolute;border-radius:50%;background:currentColor;opacity:.35;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.uls{display:flex;gap:22px;font-size:15px}
.ul{position:relative;text-decoration:none;color:var(--ink);padding-bottom:3px}
.ul::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .25s ease-out}
.ul-l::after{transform-origin:left}.ul-c::after{transform-origin:center}
.ul:hover::after,.ul:focus-visible::after{transform:scaleX(1)}
.fp{width:150px;height:100px;perspective:700px;cursor:pointer}
.fp-i{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.65,0,.35,1)}
.fp:hover .fp-i,.fp.on .fp-i{transform:rotateY(180deg)}
.fp-f,.fp-b{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:500}
.fp-f{background:var(--obj);color:var(--on-accent)}
.fp-b{background:var(--obj2);color:var(--on-obj2);transform:rotateY(180deg)}
.cf{position:absolute;inset:0;cursor:none}
.cf-t{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px}
.cf-d,.cf-r{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}
.cf-d{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--accent)}
.cf-r{width:36px;height:36px;margin:-18px 0 0 -18px;border:1.5px solid var(--accent)}
.tt{position:relative;width:36px;height:36px;border-radius:50%;padding:0}
.tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translate(-50%,6px);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;opacity:0;transition:.2s ease-out;pointer-events:none}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.tt:hover .tip,.tt:focus-visible .tip{opacity:1;transform:translate(-50%,0);transition-delay:.15s}
.spot{position:absolute;inset:0;--x:50%;--y:50%;background-image:radial-gradient(circle 90px at var(--x) var(--y),color-mix(in srgb,var(--accent) 38%,transparent),transparent 72%),radial-gradient(var(--mut) 1.1px,transparent 1.5px);background-size:auto,14px 14px}
.fsw{position:relative;overflow:hidden;background:transparent;color:var(--accent)}
.fsw::before{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s ease-out}
.fsw span{position:relative;transition:color .3s}
.fsw:hover::before{transform:scaleX(1)}
.fsw:hover span{color:var(--on-accent)}

/* enter (looping with hold) */
.a-fade{animation:a-fade 3s ease-out infinite}
.a-up{animation:a-up 3s ease-out infinite;animation-delay:calc(var(--i,0) * 90ms)}
.a-scale{animation:a-scale 3s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes a-fade{0%{opacity:0}20%,85%{opacity:1}100%{opacity:0}}
@keyframes a-up{0%{opacity:0;transform:translateY(24px)}22%,85%{opacity:1;transform:none}100%{opacity:0}}
@keyframes a-scale{0%{opacity:0;transform:scale(.6)}20%,85%{opacity:1;transform:none}100%{opacity:0}}
.row{display:flex;gap:8px}
.big{font:800 30px var(--f-display);letter-spacing:-.01em}
.split span{display:inline-block;animation:a-up 3.2s ease-out infinite;animation-delay:calc(var(--i) * 45ms);white-space:pre}
.tw{font:600 20px var(--f-display);display:flex;align-items:center}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cnt{display:grid;justify-items:center}
.cnt b{font:800 40px var(--f-display);font-variant-numeric:tabular-nums}
.cnt span{color:var(--mut);font-size:13px}
.scr{font-size:20px;font-weight:500;letter-spacing:.06em}
.mask{animation:a-mask 3.2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes a-mask{0%{clip-path:inset(0 100% 0 0)}25%,82%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
.rw{font:600 20px var(--f-display);display:flex;gap:8px;align-items:center}
.rw-w{display:inline-block;height:1.4em;overflow:hidden;color:var(--accent)}

/* nav */

.sh{display:grid;grid-template-columns:1fr auto;gap:6px;width:84%}

.lk-p i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--obj2);opacity:0}
.lk.on .lk-p i{animation:burst .6s ease-out}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-30px)}}
.pl{position:relative;width:14px;height:14px;border-radius:50%;background:var(--danger)}
.pl::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--danger);animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}

/* style */

.nu-p{box-shadow:inset 6px 6px 12px var(--neu-lo),inset -6px -6px 12px var(--neu-hi)}
.ga{position:absolute;inset:0;background:linear-gradient(120deg,var(--obj),var(--obj2),var(--accent-soft),var(--obj));background-size:300% 300%;animation:ga 8s ease-in-out infinite alternate}
@keyframes ga{from{background-position:0% 50%}to{background-position:100% 50%}}
.gr{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}

.dt{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.dt-im{position:relative;background:radial-gradient(circle at 50% 42%,#f2c9a4 0 16%,transparent 17%),radial-gradient(ellipse at 50% 100%,#3d7a5a 0 38%,transparent 39%),linear-gradient(#7fb6e0,#e8d9a8);display:flex;align-items:flex-end;padding:8px;isolation:isolate}

<div class="wrap" id="root">

<header class="hero">

  <p class="lede">「滑下來的時候帥一點」AI 只能用猜的。這些效果其實都有名字，報出名字、再補上時長與緩動，一句話就講清楚。每個術語都附即時示意、別名、可直接複製的描述句，以及在常見架站平台上的對應名稱。</p>

<script>

const CATS=[
 {id:'scroll',zh:'捲動效果',en:'Scroll',d:'隨使用者捲動頁面而觸發或連動的效果。'},
 {id:'slide',zh:'輪播與滑動',en:'Slider',d:'同一區塊內左右切換多張內容。'},

 {id:'enter',zh:'進場與文字動畫',en:'Entrance & Text',d:'元素出現時的動畫與文字特效。'},
 {id:'nav',zh:'導覽與版面元件',en:'Navigation & Layout',d:'架站平台上常見的模組／Widget。'},

 {id:'style',zh:'視覺風格',en:'Visual Style',d:'描述質感與風格的名詞。'},
 {id:'motion',zh:'動態參數',en:'Motion Parameters',d:'描述任何動畫都用得到的參數，搭配上面的術語使用。'},
];
const TOP6=['reveal','scrub','parallax','sticky','snap','hscroll'];
// 新增術語：在此陣列加一筆物件；demo 對應下方 DEMOS 的 key（可省略）
const TERMS=[
 // scroll
 {id:'reveal',cat:'scroll',zh:'捲動觸發',en:'Scroll-triggered',say:'滑到才播，卡片一張張浮出來',aka:['Scroll reveal','Animate on Scroll (AOS)','Scroll into view','進場動畫'],def:'元素捲進視窗時才播放一次進場動畫，播完就結束，和捲動速度無關。',ai:'每張卡片進入視窗 20% 時淡入上移 24px，600ms ease-out，交錯 100ms，只播一次。',plat:'Elementor：Entrance Animation／Webflow：Scroll into view／Framer：Appear',demo:'reveal',browser:1},
 {id:'scrub',cat:'scroll',zh:'捲動連動',en:'Scroll-linked',say:'滑多少動多少，手停它也停',aka:['Scrubbing','Scroll-driven animation','Scroll Transform'],def:'動畫進度直接綁定捲動位置；往回捲，動畫就倒轉。',ai:'產品圖隨捲動旋轉 0→360° 並放大到 1.5 倍，動畫進度綁定該區塊的捲動進度（scrub），不是播一次。',plat:'GSAP：ScrollTrigger scrub／Framer：Scroll Transform／Webflow：While scrolling in view／CSS：animation-timeline: scroll()',demo:'scrub',browser:1},

/* ---------- helpers ---------- */
const state={paused:false};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=n=>Array.from({length:n},(_,i)=>`<i class="ln" style="width:${[92,78,85,60,88,70][i%6]}%"></i>`).join('');
const every=(ms,fn)=>{const id=setInterval(()=>{if(!state.paused)fn()},ms);return()=>clearInterval(id)};
const N=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
const pct=sc=>sc.scrollTop/Math.max(1,sc.scrollHeight-sc.clientHeight);

/* ---------- demos: h = html, i = init(root) -> optional cleanup ---------- */
const DEMOS={
 reveal:{h:`<div class="sc"><div class="pad">${N(9,i=>`<div class="mini rv">項目 ${i+1}</div>`)}</div></div><span class="hint">↕ 在框內捲動</span>`,
  i(r){const sc=$('.sc',r);const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{root:sc,threshold:.3});$$('.rv',r).forEach((el,i)=>{el.style.transitionDelay=(i%3)*80+'ms';io.observe(el)});return()=>io.disconnect()}},
 scrub:{h:`<div class="sc"><div class="scrub"><div class="pin"><div class="o"></div><span class="mono">0%</span></div></div></div><span class="hint">↕ 捲動＝播放進度</span>`,
  i(r){const sc=$('.sc',r),o=$('.o',r),t=$('.mono',r);sc.addEventListener('scroll',()=>{const p=pct(sc);o.style.transform=`rotate(${p*360}deg) scale(${.7+p*.9})`;o.style.borderRadius=8+p*12+'px';t.textContent=Math.round(p*100)+'%'})}},
 parallax:{h:`<div class="sc"><div class="par"><div class="par-bk"><i style="left:60%;top:16px;width:70px;height:70px"></i><i style="left:70%;top:150px;width:100px;height:100px"></i><i style="left:58%;top:290px;width:56px;height:56px"></i><i style="left:80%;top:380px;width:44px;height:44px"></i></div><div class="par-fr">${N(6,i=>`<div class="mini">前景 ${i+1}</div>`)}</div></div></div><span class="hint">↕ 背景圓形較慢</span>`,
  i(r){const sc=$('.sc',r),bk=$('.par-bk',r);sc.addEventListener('scroll',()=>{bk.style.transform=`translateY(${sc.scrollTop*.6}px)`})}},
 sticky:{h:`<div class="sc">${['A','B','C'].map(x=>`<section><h5 class="stk">章節 ${x}</h5><div class="pad">${L(7)}</div></section>`).join('')}</div><span class="hint">↕ 標題黏在頂端</span>`},
 snap:{h:`<div class="snap">${N(5,i=>`<div class="snap-i">${i+1}</div>`)}</div><span class="hint">⇆ 橫向滑動</span>`},
 hscroll:{h:`<div class="sc"><div class="scrub" style="height:560px"><div class="pin" style="justify-content:flex-start"><div class="hs-row">${N(6,i=>`<div class="c${i%4+1}">${i+1}</div>`)}</div></div></div></div><span class="hint">↕ 往下捲，卡片往左</span>`,
  i(r){const sc=$('.sc',r),row=$('.hs-row',r),pin=$('.pin',r);sc.addEventListener('scroll',()=>{const max=row.scrollWidth-pin.clientWidth;row.style.transform=`translateX(${-pct(sc)*Math.max(0,max)}px)`})}},
 progress:{h:`<div class="pbar"><b></b></div><div class="sc"><div class="pad">${L(30)}</div></div><span class="hint">↕ 看頂端色條</span>`,
  i(r){const sc=$('.sc',r),b=$('.pbar b',r);sc.addEventListener('scroll',()=>{b.style.width=pct(sc)*100+'%'})}},
 smooth:{h:`<div class="col"><div class="ctl"><button data-b="smooth">平滑捲到 D</button><button data-b="auto">瞬間跳到 D</button><button data-b="top">回頂</button></div><div class="sc">${['A','B','C','D'].map(x=>`<section class="sec" data-s="${x}"><b>區塊 ${x}</b>${L(3)}</section>`).join('')}</div></div>`,
  i(r){const sc=$('.sc',r),d=$('[data-s="D"]',r);$$('[data-b]',r).forEach(b=>b.onclick=()=>{const m=b.dataset.b;sc.scrollTo({top:m==='top'?0:d.offsetTop,behavior:m==='auto'?'auto':'smooth'})})}},
 btt:{h:`<div class="sc"><div class="pad">${L(30)}</div></div><button class="btt" aria-label="回到頂端">↑</button><span class="hint">↕ 往下捲</span>`,
  i(r){const sc=$('.sc',r),b=$('.btt',r);sc.addEventListener('scroll',()=>b.classList.toggle('show',sc.scrollTop>60));b.onclick=()=>sc.scrollTo({top:0,behavior:'smooth'})}},
 infinite:{h:`<div class="sc"><div class="pad inf"></div><div class="inf-l mono">往下捲載入更多</div></div>`,
  i(r){const sc=$('.sc',r),box=$('.inf',r),l=$('.inf-l',r);let n=0,busy=false;const add=()=>{box.insertAdjacentHTML('beforeend',N(5,()=>`<div class="mini">商品 ${++n}</div>`))};add();
   sc.addEventListener('scroll',()=>{if(busy||n>=30||sc.scrollHeight-sc.scrollTop-sc.clientHeight>20)return;busy=true;l.textContent='載入中…';setTimeout(()=>{add();busy=false;l.textContent=n>=30?'已全部載入':'往下捲載入更多'},500)})}},
 scrollspy:{h:`<div class="spy"><nav>${['A','B','C','D'].map((x,i)=>`<a href="#" data-t="${x}"${i?'':' class="on"'}>章節 ${x}</a>`).join('')}</nav><div class="sc">${['A','B','C','D'].map(x=>`<section class="sec" data-s="${x}"><b>章節 ${x}</b>${L(4)}</section>`).join('')}</div></div>`,
  i(r){const sc=$('.sc',r),secs=$$('.sec',r),as=$$('nav a',r);sc.addEventListener('scroll',()=>{let c='A';secs.forEach(s=>{if(s.offsetTop-sc.scrollTop<=40)c=s.dataset.s});if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2)c='D';as.forEach(a=>a.classList.toggle('on',a.dataset.t===c))});
   as.forEach(a=>a.onclick=e=>{e.preventDefault();sc.scrollTo({top:$(`[data-s="${a.dataset.t}"]`,r).offsetTop,behavior:'smooth'})})}},
 carousel:{h:`<div class="car"><div class="car-t">${N(4,i=>`<div class="car-s c${i+1}">Slide ${i+1}</div>`)}</div><button class="car-a car-p" aria-label="上一張">‹</button><button class="car-a car-n" aria-label="下一張">›</button><div class="dots">${N(4,i=>`<button aria-label="第 ${i+1} 張"></button>`)}</div></div>`,
  i(r){const t=$('.car-t',r),ds=$$('.dots button',r),car=$('.car',r);let i=0,hov=false;const go=n=>{i=(n+4)%4;t.style.transform=`translateX(${-i*100}%)`;ds.forEach((d,k)=>d.classList.toggle('on',k===i))};go(0);
   $('.car-p',r).onclick=()=>go(i-1);$('.car-n',r).onclick=()=>go(i+1);ds.forEach((d,k)=>d.onclick=()=>go(k));car.onmouseenter=()=>hov=true;car.onmouseleave=()=>hov=false;return every(3000,()=>{if(!hov)go(i+1)})}},
 crossfade:{h:`<div class="sx" style="inset:0">${N(3,i=>`<div class="fs-i c${i+1}${i?'':' on'}">Slide ${i+1}</div>`)}</div>`,
  i(r){const s=$$('.fs-i',r);let i=0;return every(2400,()=>{s[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on')})}},
 marquee:{h:`<div class="mq"><div class="mq-t">${(()=>{const w=['Studio','Nordic','Atlas','Kumo','Orbit','Pixel'].map(x=>`<span class="mq-i">${x}</span>`).join('');return w+w})()}</div></div><span class="hint">滑鼠移入暫停</span>`},
 swipe:{h:`<div class="sw"><div class="sw-t">${N(4,i=>`<div class="c${i+1}">${i+1} / 4</div>`)}</div></div><span class="hint">⇆ 拖曳或滑動</span>`,
  i(r){const w=$('.sw',r),t=$('.sw-t',r);let i=0,x0=null,dx=0;const set=()=>t.style.transform=`translateX(calc(${-i*100}% + ${dx}px))`;
   w.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;t.style.transition='none';w.setPointerCapture(e.pointerId)});
   w.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if((i===0&&dx>0)||(i===3&&dx<0))dx*=.3;set()});
   const up=()=>{if(x0===null)return;if(dx<-40)i=Math.min(i+1,3);if(dx>40)i=Math.max(i-1,0);x0=null;dx=0;t.style.transition='';set()};w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up)}},
 peek:{h:`<div class="pk">${N(5,i=>`<div class="pk-i c${i%4+1}">${i+1}</div>`)}</div><span class="hint">⇆ 露出下一張</span>`},
 beforeafter:{h:`<div class="ba"><div class="ba-a">AFTER</div><div class="ba-b">BEFORE</div><div class="ba-line"></div><input class="ba-r" type="range" min="0" max="100" value="50" aria-label="比較位置"></div>`,
  i(r){const b=$('.ba',r);$('.ba-r',r).oninput=e=>b.style.setProperty('--p',e.target.value+'%')}},
 thumbs:{h:`<div class="th"><div class="th-m c1">1</div><div class="th-r">${N(4,i=>`<button class="th-t c${i+1}${i?'':' on'}" data-n="${i+1}" aria-label="第 ${i+1} 張"></button>`)}</div></div>`,
  i(r){const m=$('.th-m',r);$$('.th-t',r).forEach(b=>b.onclick=()=>{$$('.th-t',r).forEach(x=>x.classList.toggle('on',x===b));m.className='th-m c'+b.dataset.n;m.textContent=b.dataset.n;m.animate([{opacity:0},{opacity:1}],{duration:300})})}},
 lift:{h:`<div class="mini lift">卡片</div><span class="hint">滑鼠移入</span>`},
 zoom:{h:`<div class="hz"><div class="hz-i"></div><span class="hz-cap">作品名稱</span></div><span class="hint">滑鼠移入</span>`},
 tilt:{h:`<div class="tl"><b>MEMBER</b><span>0000 1234 5678</span><i class="tl-g"></i></div><span class="hint">在框內移動滑鼠</span>`,
  i(r){const s=r.closest('.stage'),c=$('.tl',r);s.addEventListener('pointermove',e=>{const b=c.getBoundingClientRect();const x=Math.max(-.5,Math.min(.5,(e.clientX-b.left)/b.width-.5)),y=Math.max(-.5,Math.min(.5,(e.clientY-b.top)/b.height-.5));c.style.transform=`perspective(600px) rotateX(${-y*16}deg) rotateY(${x*16}deg)`;c.style.setProperty('--gx',(x+.5)*100+'%');c.style.setProperty('--gy',(y+.5)*100+'%')});s.addEventListener('pointerleave',()=>c.style.transform='')}},
 magnetic:{h:`<button class="btn mg">立即預約</button><span class="hint">游標靠近按鈕</span>`,
  i(r){const s=r.closest('.stage'),b=$('.mg',r);s.addEventListener('pointermove',e=>{const k=b.getBoundingClientRect();const dx=e.clientX-(k.left+k.width/2),dy=e.clientY-(k.top+k.height/2);b.style.transform=Math.hypot(dx,dy)<110?`translate(${dx*.35}px,${dy*.35}px)`:''});s.addEventListener('pointerleave',()=>b.style.transform='')}},
 ripple:{h:`<button class="btn rp">點我看漣漪</button>`,
  i(r){const b=$('.rp',r);b.onclick=e=>{const k=b.getBoundingClientRect(),d=Math.max(k.width,k.height)*2,i=document.createElement('i');i.style.cssText=`width:${d}px;height:${d}px;left:${(e.clientX||k.left+k.width/2)-k.left-d/2}px;top:${(e.clientY||k.top+k.height/2)-k.top-d/2}px`;b.appendChild(i);setTimeout(()=>i.remove(),650)}}},
 underline:{h:`<div class="uls"><a href="#" class="ul ul-l">由左展開</a><a href="#" class="ul ul-c">由中間展開</a></div><span class="hint">滑鼠移入連結</span>`,i(r){$$('a',r).forEach(a=>a.onclick=e=>e.preventDefault())}},
 flip:{h:`<div class="fp" tabindex="0" role="button" aria-label="翻牌卡片"><div class="fp-i"><div class="fp-f">正面</div><div class="fp-b">背面：簡介</div></div></div><span class="hint">hover 或點擊</span>`,
  i(r){const f=$('.fp',r);const t=()=>f.classList.toggle('on');f.onclick=t;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}}},
 cursor:{h:`<div class="cf"><span class="cf-t">在此區移動滑鼠</span><i class="cf-r"></i><i class="cf-d"></i></div>`,
  i(r){const a=$('.cf',r),d=$('.cf-d',r),g=$('.cf-r',r);let tx=0,ty=0,rx=0,ry=0,raf;const place=()=>{tx=rx=a.clientWidth/2;ty=ry=a.clientHeight*.72};place();
   const tick=()=>{rx+=(tx-rx)*.15;ry+=(ty-ry)*.15;d.style.transform=`translate(${tx}px,${ty}px)`;g.style.transform=`translate(${rx}px,${ry}px)`;raf=requestAnimationFrame(tick)};tick();

 counter:{h:`<div class="cnt"><b>0</b><span>位客戶</span></div>`,

 scramble:{h:`<div class="scr mono"></div>`,

 stickyheader:{h:`<div class="sc"><div class="hdr"><b>LOGO</b><span><i></i><i></i><i></i></span></div><div class="pad">${L(26)}</div></div><span class="hint">↕ 捲動後縮小</span>`,

 lightbox:{h:`<div class="lbg">${N(4,i=>`<button class="c${i+1}" data-i="${i}" aria-label="放大第 ${i+1} 張"></button>`)}</div><div class="lb" role="dialog" aria-label="燈箱"><div class="lb-im c1"></div><button class="lb-x" aria-label="關閉">×</button><button class="lb-p" aria-label="上一張">‹</button><button class="lb-n" aria-label="下一張">›</button><span class="lb-c mono">1 / 4</span></div><span class="hint">點縮圖</span>`,

 spinner:{h:`<div class="sp"><i class="sp-ring"></i><span class="sp-dots">${N(3,i=>`<i style="--i:${i}"></i>`)}</span><span class="sp-bars">${N(4,i=>`<i style="--i:${i}"></i>`)}</span></div>`},

 progressbar:{h:`<div class="pg"><div class="pg-row"><span class="mono">determinate</span><div class="pg-t"><b class="pg-d"></b></div><span class="mono pg-v">0%</span></div><div class="pg-row"><span class="mono">indeterminate</span><div class="pg-t"><b class="pg-i"></b></div><span></span></div></div>`,

 shake:{h:`<form class="sh" novalidate><input id="demo-shake" type="email" placeholder="輸入 Email" aria-label="Email"><button class="btn sm">送出</button><p></p></form><span class="hint">空白或格式錯誤時送出</span>`,
  i(r){const f=$('form',r),inp=$('input',r),m=$('p',r);f.onsubmit=e=>{e.preventDefault();inp.classList.remove('err');void inp.offsetWidth;if(!/^\S+@\S+\.\S+$/.test(inp.value)){inp.classList.add('err');m.className='e';m.textContent='請輸入正確的 Email 格式'}else{m.className='k';m.textContent='✓ 已送出'}}}},

 duration:{h:`<div class="lanes tx">${[150,300,600,1000].map(d=>`<div class="lane"><span class="mono">${d}ms</span><div class="tr"><i style="transition-duration:${d}ms"></i></div></div>`).join('')}</div>`,

 delay:{h:`<div class="lanes tx">${[0,150,300,450].map(d=>`<div class="lane"><span class="mono">delay ${d}</span><div class="tr"><i style="transition-duration:400ms;transition-delay:${d}ms"></i></div></div>`).join('')}</div>`,
  i(r){const l=$('.lanes',r);return every(1600,()=>l.classList.toggle('go'))}},
 spring:{h:`<div class="sprw"><div><div class="o a-ease"></div>ease-out</div><div><div class="o b a-spr"></div>spring</div></div>`},

 trigger:{h:`<div class="trg"><div class="t-load">載入</div><div class="t-hover">hover</div><div class="t-click" role="button" tabindex="0">click</div></div>`,

/* ---------- render ---------- */
function card(t){
  const d=t.demo&&DEMOS[t.demo];
  return `<article class="term" id="t-${esc(t.id)}" data-cat="${esc(t.cat)}" data-s="${esc([t.zh,t.en,t.say,(t.aka||[]).join(' '),t.def].join(' ').toLowerCase())}">
    <div class="stage${t.browser?' browser':''}"${d?` data-demo="${esc(t.demo)}"`:''}>${d?'<button class="replay" type="button">重播</button>':`<span class="mono" style="color:var(--mut);font-size:12px">尚無示意</span>`}</div>
    <div class="t-body">
      <div class="names"><h3>${esc(t.zh)}</h3><span class="en">${esc(t.en)}</span></div>
      ${t.say?`<p class="t-say">白話：<q>${esc(t.say)}</q></p>`:''}
      <p class="def">${esc(t.def)}</p>
      ${t.aka&&t.aka.length?`<div class="aka">${t.aka.map(a=>`<span>${esc(a)}</span>`).join('')}</div>`:''}
      ${t.ai?`<div class="ai"><span class="lb">對 AI 這樣說</span><p>${esc(t.ai)}</p><button type="button" class="cp">複製</button></div>`:''}
      ${t.plat?`<p class="plat"><b>平台對應</b>　${esc(t.plat)}</p>`:''}
    </div></article>`;
}
let io;
function mount(stage){
  if(stage._c){stage._c();stage._c=null}
  const d=DEMOS[stage.dataset.demo];if(!d)return;
  $$('.sx-root',stage).forEach(n=>n.remove());
  const box=document.createElement('div');box.className='sx sx-root';box.innerHTML=d.h;
  stage.appendChild(box);
  try{const c=d.i&&d.i(box);if(typeof c==='function')stage._c=c}catch(e){console.error(stage.dataset.demo,e)}
}
function render(){
  const cats=CATS,terms=TERMS;
  $('#cats').innerHTML=cats.map(c=>{
    const ts=terms.filter(t=>t.cat===c.id);
    return `<section class="cat" id="c-${c.id}" data-cat="${c.id}"><div class="cat-h"><h2>${esc(c.zh)}</h2><span class="en">${esc(c.en)} · ${ts.length}</span><p>${esc(c.d)}</p></div><div class="grid">${ts.map(card).join('')}</div></section>`}).join('');
  $('#chips').innerHTML=[{id:'all',zh:'全部'},...cats].map(c=>`<button class="chip" type="button" data-c="${c.id}" aria-pressed="${c.id===filter.cat}">${esc(c.zh)}${c.id==='all'?'':`<small>${TERMS.filter(t=>t.cat===c.id).length}</small>`}</button>`).join('');
  $('#stats').innerHTML=`<span>${terms.length} 個術語</span><span>${CATS.length} 個分類</span><span>每張卡片可直接操作</span>`;
  $('#top6').innerHTML=TOP6.map((id,i)=>{const t=TERMS.find(x=>x.id===id);return `<a class="t6" href="#t-${id}"><span class="n">${i+1}</span><b>${esc(t.en)}｜${esc(t.zh)}</b><span>${esc(t.say)}</span></a>`}).join('');
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._m){e.target._m=1;mount(e.target)}}),{rootMargin:'200px'});
  $$('.stage[data-demo]').forEach(s=>io.observe(s));
  applyFilter();
}

/* ---------- filter ---------- */
const filter={q:'',cat:'all'};
function applyFilter(){
  let shown=0;
  $$('.cat').forEach(sec=>{
    let n=0;const catOk=filter.cat==='all'||filter.cat===sec.dataset.cat;
    $$('.term',sec).forEach(t=>{const ok=catOk&&(!filter.q||t.dataset.s.includes(filter.q));t.hidden=!ok;if(ok)n++});
    sec.hidden=!n;shown+=n;
  });
  $('#empty').hidden=!!shown;
  $$('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.c===filter.cat));
}
$('#q').addEventListener('input',e=>{filter.q=e.target.value.trim().toLowerCase();applyFilter()});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter.cat=b.dataset.c;applyFilter();try{localStorage.setItem('motion-glossary.cat',filter.cat)}catch(_){}});

/* ---------- copy ---------- */
async function copy(text,btn,label){
  const old=btn.textContent;let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove()}
  btn.textContent=ok?(label||'已複製'):'請手動選取';setTimeout(()=>btn.textContent=old,1400);
}
$('#cats').addEventListener('click',e=>{
  const cp=e.target.closest('.cp');if(cp){copy($('p',cp.parentNode).textContent,cp);return}
  const rp=e.target.closest('.replay');if(rp){mount(rp.closest('.stage'));return}
});

/* ---------- pause ---------- */
const pauseBtn=$('#pause');
function setPaused(p){state.paused=p;$('#root').classList.toggle('paused',p);pauseBtn.setAttribute('aria-pressed',p);pauseBtn.textContent=p?'播放示意動畫':'暫停示意動畫'}
pauseBtn.onclick=()=>setPaused(!state.paused);

/* ---------- boot ---------- */
try{const c=localStorage.getItem('motion-glossary.cat');if(c&&(c==='all'||CATS.some(x=>x.id===c)))filter.cat=c}catch(_){}
render();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)setPaused(true);
</script>
</body>
